aid: luckin-coffee
name: Luckin Coffee
description: 'Luckin Coffee (瑞幸咖啡) is a Chinese multinational coffee company and coffeehouse chain
  headquartered in Xiamen, China. Founded in 2017, it runs a technology-driven, mobile-app-first retail
  model in which nearly all ordering, payment, and membership happen through its native app and mini-programs
  rather than at a counter. As of 31 March 2026 the company operated 33,596 stores globally. It was
  surfaced as a portfolio company of IDG Capital and added to the API Evangelist network. As of this
  enrichment pass Luckin Coffee publishes no public developer program, open platform, or API — its
  digital surface is a consumer ordering app, not a documented API product.'
